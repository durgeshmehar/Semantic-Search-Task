services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      # Qdrant's own on-disk storage: raw vectors, the HNSW graph, and
      # quantized vectors for collections configured with on_disk=true.
      - ./data/qdrant:/qdrant/storage
    environment:
      # A conservative cap so quantized-vector residency (see
      # app/vector_store.py) stays predictable rather than growing to
      # whatever the host happens to have free.
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    image: large-file-search:latest
    container_name: large-file-search
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      # Uploads and the SQLite metadata/queue database. Persisting this is
      # what lets an interrupted upload resume after the container restarts.
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      WORKER_COUNT: "2"
      EMBED_BATCH_SIZE: "32"
      MAX_CHUNK_BYTES: "16777216"
    # The assignment's constraint, enforced rather than assumed: the container
    # is capped at 4 GB, so an accidental full-file read fails here instead of
    # silently passing on a larger development machine. Qdrant runs in its own
    # container with its own limit above, so this is the API + worker budget.
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  # Runs the suite against the same image, then exits. `--profile test` keeps
  # it out of the default `docker compose up`.
  tests:
    build: .
    image: large-file-search:latest
    profiles: ["test"]
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]
    environment:
      DATA_DIR: /tmp/test-data
      QDRANT_URL: http://qdrant:6333
